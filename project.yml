name: Jack
options:
  bundleIdPrefix: dev.jack
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  JackCore:
    type: framework
    platform: macOS
    sources: [Sources/JackCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jack.core
        GENERATE_INFOPLIST_FILE: YES
  Jack:
    type: application
    platform: macOS
    sources:
      - Sources/Jack
      - Resources/Assets.xcassets
    dependencies:
      - target: JackCore
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jack.desktop
        PRODUCT_NAME: Jack
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
schemes:
  Jack:
    build:
      targets:
        Jack: all
    run:
      config: Debug
