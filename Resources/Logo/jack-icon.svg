<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Jack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3042"/>
      <stop offset="1" stop-color="#0E1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#5B6B9A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5B6B9A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="760">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4CBD9"/>
    </linearGradient>
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="0" y1="250" x2="0" y2="670">
      <stop offset="0" stop-color="#7B8499"/>
      <stop offset="1" stop-color="#4C5466"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB15C"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 body inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- Jack: a hub with six agents; back arms recede, front arms form the Y -->
  <g filter="url(#shadow)">
    <g stroke="url(#back)" stroke-width="34" stroke-linecap="round" fill="url(#back)">
      <line x1="512" y1="512" x2="512" y2="290"/>
      <line x1="512" y1="512" x2="704" y2="623"/>
      <line x1="512" y1="512" x2="320" y2="623"/>
      <circle cx="512" cy="290" r="44" stroke="none"/>
      <circle cx="704" cy="623" r="44" stroke="none"/>
      <circle cx="320" cy="623" r="44" stroke="none"/>
    </g>

    <circle cx="512" cy="512" r="66" fill="url(#front)"/>

    <g stroke="url(#front)" stroke-width="46" stroke-linecap="round" fill="url(#front)">
      <line x1="512" y1="512" x2="718" y2="393"/>
      <line x1="512" y1="512" x2="306" y2="393"/>
      <line x1="512" y1="512" x2="512" y2="740"/>
      <circle cx="718" cy="393" r="60" stroke="none"/>
      <circle cx="306" cy="393" r="60" stroke="none"/>
    </g>
    <!-- the active agent -->
    <circle cx="512" cy="740" r="64" fill="url(#accent)"/>
  </g>
</svg>
